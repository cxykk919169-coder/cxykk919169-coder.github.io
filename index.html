<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>短剧总站 · 正在跳转</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0d0d11;
    color:#e8e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .box{text-align:center;max-width:380px;width:100%}
  .mark{
    width:64px;height:64px;margin:0 auto 22px;
    border-radius:18px;
    background:linear-gradient(135deg,#e8384f,#b8283c);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:800;color:#fff;
    box-shadow:0 10px 32px -8px rgba(232,56,79,.62);
    letter-spacing:-1px;
  }
  h1{font-size:19px;font-weight:700;margin-bottom:9px;letter-spacing:.2px}
  p{font-size:13.5px;line-height:1.75;color:#8f8f9e;margin-bottom:24px}
  .btn{
    display:inline-block;padding:12px 30px;border-radius:11px;
    background:#e8384f;color:#fff;font-size:14px;font-weight:600;
    text-decoration:none;transition:.15s;
    box-shadow:0 8px 24px -8px rgba(232,56,79,.7);
  }
  .btn:hover{background:#f04a60;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .bar{
    width:100%;height:3px;border-radius:2px;
    background:#1c1c24;margin-bottom:26px;overflow:hidden;
  }
  .bar i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,#e8384f,#ff7a8a);
    border-radius:2px;
    animation:go 1.1s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes go{to{width:100%}}
  .foot{
    margin-top:34px;font-size:11.5px;color:#4d4d5a;line-height:1.7;
  }
  @media(prefers-reduced-motion:reduce){
    .bar i{animation:none;width:100%}
    .btn{transition:none}
  }
</style>
<noscript><meta http-equiv="refresh" content="0;url=/huangguo-web/"></noscript>
</head>
<body>
<div class="box">
  <div class="mark">剧</div>
  <div class="bar"><i></i></div>
  <h1>正在前往短剧总站</h1>
  <p>如果没有自动跳转，点下面的按钮。</p>
  <a class="btn" id="go" href="/huangguo-web/">进入总站</a>
  <div class="foot">短剧聚合 · 多站点合集</div>
</div>

<script>
(function () {
  'use strict';
  var TARGET = '/huangguo-web/';
  var go = document.getElementById('go');
  if (go) go.href = TARGET;

  /* 尽量保留 hash / query, 例如 /#/drama/82 这种深链 */
  var tail = (location.hash || '') ;
  var full = TARGET + tail;

  function jump() {
    try { location.replace(full); }
    catch (e) { location.href = full; }
  }

  /* 给用户看到跳转反馈: 280ms 后再跳 */
  setTimeout(jump, 280);

  /* 兜底: 3 秒还没走就走一次硬跳 */
  setTimeout(function () {
    if (document.visibilityState !== 'hidden') location.href = full;
  }, 3000);
})();
</script>
</body>
</html>
